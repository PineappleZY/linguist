<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Linguist · 功能大全</title>
<style>
  :root {
    --bg: #f5f5f7; --card: #ffffff; --ink: #1d1d1f; --ink-2: #4b4b52; --ink-3: #86868b;
    --line: #d2d2d7; --accent: #0071e3; --ui: #0a84ff; --feature: #30b0c7; --module: #8e8e93;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #000; --card: #1c1c1e; --ink: #f5f5f7; --ink-2: #c7c7cc; --ink-3: #8e8e93;
      --line: #38383a; --accent: #0a84ff; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans", sans-serif; }
  header { padding: 28px 28px 6px; }
  h1 { margin: 0 0 4px; font-size: 26px; letter-spacing: -0.02em; }
  .sub { color: var(--ink-2); font-size: 14px; max-width: 940px; }
  .stats { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 0; }
  .stat { background: var(--card); border: 0.5px solid var(--line); border-radius: 10px;
    padding: 6px 10px; font-size: 13px; color: var(--ink-2); }
  .stat b { color: var(--ink); font-variant-numeric: tabular-nums; }
  .version-strip { display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
    padding: 10px 28px 0; font-size: 13px; color: var(--ink-2); }
  .version-chip { border: 0.5px solid var(--line); background: var(--card); color: var(--ink);
    border-radius: 999px; padding: 3px 10px; font: inherit; font-size: 12.5px; cursor: pointer; }
  .version-chip .tag { color: var(--ink-3); margin-right: 4px; }
  .version-chip.new .tag { color: var(--ui); }
  .version-chip.updated .tag { color: var(--accent); }
  .bar { display: flex; gap: 8px; align-items: center; padding: 12px 28px; flex-wrap: wrap; }
  input[type=search] { flex: 1 1 260px; max-width: 360px; padding: 8px 12px; border-radius: 10px;
    border: 0.5px solid var(--line); background: var(--card); color: var(--ink); font: inherit; }
  .chip { border: 0.5px solid var(--line); background: var(--card); color: var(--ink-2);
    border-radius: 999px; padding: 5px 12px; font: inherit; font-size: 13px; cursor: pointer; }
  .chip[aria-pressed=false] { opacity: 0.45; }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 390px; gap: 18px; padding: 0 28px 40px; align-items: start; }
  @media (max-width: 1040px) { main { grid-template-columns: 1fr; } aside { position: static; } }
  .canvas { background: var(--card); border: 0.5px solid var(--line); border-radius: 16px;
    overflow: auto; max-height: 78vh; }
  svg { display: block; }
  .edge { stroke: var(--line); stroke-width: 1.1; fill: none; }
  .edge.is-hot { stroke: var(--accent); stroke-width: 2; }
  .node { cursor: pointer; outline: none; }
  .node rect { fill: var(--card); stroke: var(--line); stroke-width: 1; }
  .node text { fill: var(--ink); font-size: 12.5px; pointer-events: none; }
  .node .zh { fill: var(--ink-3); font-size: 11px; }
  .node.is-dim { opacity: 0.2; }
  .node.is-hot rect { stroke: var(--accent); stroke-width: 2; }
  aside { position: sticky; top: 16px; background: var(--card); border: 0.5px solid var(--line);
    border-radius: 16px; padding: 18px 20px; max-height: 78vh; overflow: auto; }
  aside h2 { margin: 0; font-size: 17px; letter-spacing: -0.01em; }
  aside .zh { color: var(--ink-3); font-size: 14px; margin-top: 2px; }
  aside p { color: var(--ink-2); font-size: 14px; }
  aside .label { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3);
    margin: 16px 0 6px; }
  code { background: var(--bg); border: 0.5px solid var(--line); border-radius: 6px;
    padding: 1px 6px; font-size: 12.5px; }
  ul { margin: 0; padding-left: 18px; }
  .hint { color: var(--ink-3); font-size: 13px; }
  .empty { color: var(--ink-3); }
</style>
</head>
<body>
<header>
  <h1>Linguist <span id="version"></span> · 功能大全</h1>
  <div class="sub">每个节点是一件事，连线是「它靠什么完成」。点任意节点看它做什么、在哪几个文件里、涉及哪些键。
  数字由 <code>docs/feature-map/build.mjs</code> 从 <code>6.0/web</code> 直接读出；改了代码，重跑一次即可。</div>
  <div class="stats" id="stats"></div>
  <div class="version-strip" id="thisVersion"></div>
</header>
<div class="bar">
  <input type="search" id="q" placeholder="搜索功能、文件名、说明…" aria-label="搜索">
  <button class="chip" id="all">全部</button>
  <button class="chip" data-layer="ui" aria-pressed="true">界面</button>
  <button class="chip" data-layer="feature" aria-pressed="true">能力</button>
  <button class="chip" data-layer="module" aria-pressed="true">模块</button>
  <span class="hint" id="count"></span>
</div>
<main>
  <div class="canvas"><svg id="graph" xmlns="http://www.w3.org/2000/svg"></svg></div>
  <aside id="detail"><div class="empty">点一个节点看细节。</div></aside>
</main>
<script>
const DATA = {"generated":"2026-10-17T06:57:12.168Z","counts":{"version":"6.5.0","languages":7,"liveLanguages":5,"retiredLanguages":["it","es"],"wordCards":40,"sentenceCards":9,"documentCards":4,"uiLanguages":5,"strings":420,"timeoutMs":45000,"documentTimeoutMs":90000,"chunkChars":20000,"maxFileChars":200000,"practiceRound":5,"assertions":765},"cardLists":{"latin":25,"ja":17,"zh":16,"sentence":9},"layers":[{"id":"ui","label":"界面","colour":"#0A84FF"},{"id":"feature","label":"能力","colour":"#30B0C7"},{"id":"module","label":"模块","colour":"#8E8E93"}],"latest":{"version":"6.5.0","summary":"练习不再自动朗读、看过提示才能播放；拼错后可直接重打；随机拒收外语词；补全主题/模型/词源标签；文档真正截断且 id 用全文；取消星标的行先留在原页。"},"badges":{"practice":"updated","surprise":"updated","i18n":"updated","ids":"updated","doc-view":"updated","starred":"updated"},"changes":[{"version":"6.5.0","summary":"练习不再自动朗读、看过提示才能播放；拼错后可直接重打；随机拒收外语词；补全主题/模型/词源标签；文档真正截断且 id 用全文；取消星标的行先留在原页。","added":[],"changed":["practice","surprise","i18n","ids","doc-view","starred"]},{"version":"6.4.0","summary":"第一次拼错的词与跳过的词一起进入复习，进度点用琥珀区分；补全七处界面硬编码；随机只从五种在用语里选词。","added":[],"changed":["practice-skip","surprise","i18n","starred"]},{"version":"6.3.0","summary":"星标的练习来源可以选一种语言；图谱从这一版起随版本校验。","added":["practice-source"],"changed":["starred","tests"]},{"version":"6.2.0","summary":"跳过当前词并在组末回到被跳过的词；删掉两张西语死卡、列表按组过滤、每行可置顶；新增这张功能地图。","added":["practice-skip"],"changed":["practice","card-prefs","cards","tests","preview"]},{"version":"6.1.0","summary":"练习直接给词性与释义、提示给音标 / 声调 / 拍数；卡名随界面语言；分组常驻恢复；DOCX；保留换行；信达雅。","added":["practice-hints"],"changed":["practice","card-prefs","extract","prompts","file"]}],"nodes":[{"id":"shell","layer":"ui","label":"App shell","zh":"应用外壳","files":["js/app.js","index.html"],"summary":"Hash router, top bar, three-tab bar, theme, interface language, first paint. Also the first-run order: import prompt → tour.","keys":["#/dictionary","#/favorites","#/profile","#/word/\u003cid>"]},{"id":"router","layer":"module","label":"Router","zh":"路由","files":["js/app.js"],"summary":"Four routes; scroll is remembered per route; leaving the word view aborts its requests."},{"id":"tabs","layer":"ui","label":"Bottom tabs","zh":"底部三标签","files":["js/app.js"],"summary":"Dictionary / Starred / Profile — the only navigation. Real links, so they can be opened in a new tab."},{"id":"dictionary","layer":"ui","label":"Dictionary","zh":"查词页","files":["js/view-dictionary.js"],"summary":"Search, the four lookup types, the language picker, Surprise, candidates, and history grouped by day.","keys":["lookup-input","lookup-lang","lookup-surprise","history-search"]},{"id":"lookup-types","layer":"feature","label":"Auto · Word · Sentence · File","zh":"四种查询类型","files":["js/view-dictionary.js"],"summary":"Auto guesses between word and sentence at no cost, and falls back to sentence analysis when a word lookup says not_found."},{"id":"accent-rescue","layer":"feature","label":"Accent rescue","zh":"重音模糊输入","files":["js/view-dictionary.js","js/prompts.js"],"summary":"Typing cote in a language with accents asks for the accented candidates first; a form that is itself valid is offered at the top, marked you typed this."},{"id":"reverse","layer":"feature","label":"Reverse lookup","zh":"反查","files":["js/view-dictionary.js"],"summary":"A non-Latin query while a Latin-script language is pinned asks for candidate headwords instead of failing."},{"id":"surprise","layer":"feature","label":"Surprise me","zh":"随手一查","files":["js/view-dictionary.js"],"summary":"One beautiful word, remembered so it is never repeated (100 remembered), shown for a beat before the ordinary lookup runs."},{"id":"history","layer":"feature","label":"History","zh":"历史记录","files":["js/view-dictionary.js","js/ui.js"],"summary":"One group per calendar day, foldable, searchable by word and gloss (accent-insensitive), each row starred or deleted with undo."},{"id":"entry","layer":"ui","label":"Entry page","zh":"词条页","files":["js/view-word.js"],"summary":"Word header, four request lines, the card sections, forms paradigms, explanation-language switch, collapse/expand."},{"id":"overview","layer":"feature","label":"Overview request","zh":"概览请求","files":["js/api.js","js/prompts.js"],"summary":"One small request: language, reading, part of speech, one-line gloss, register, tags. The language it names decides the entry id and the prompts."},{"id":"deep-lines","layer":"feature","label":"Four deep lines","zh":"四条深度线","files":["js/api.js","js/view-word.js"],"summary":"Etymology, usage, inflection and distinction run in parallel; Japanese and Chinese get three because they have no paradigm to tabulate. Each line fails and retries on its own."},{"id":"cards","layer":"feature","label":"40 word cards","zh":"词条卡片 40 张","files":["js/config.js","js/view-word.js"],"summary":"One card per idea, rendered only when its field is non-empty; grouped Word DNA / Meaning / Forms / Context, Word DNA first."},{"id":"dna","layer":"feature","label":"Word DNA block","zh":"词根块","files":["js/config.js","assets/app.css"],"summary":"The root cards share one container with a guide line, so the first thing a reader meets is where the word came from."},{"id":"forms","layer":"feature","label":"Forms & paradigms","zh":"形态与变位","files":["js/view-word.js"],"summary":"Tense by person tables, German four-case declension, adjective endings — folded per tense, with card-level expand and collapse."},{"id":"explain-lang","layer":"feature","label":"Explanation language","zh":"解释语言","files":["js/view-word.js","js/store.js"],"summary":"One default per source language in Profile; the entry toolbar switches this one entry, and the id carries the language so switching back is a cache hit."},{"id":"sentence","layer":"feature","label":"Sentence analysis","zh":"句子分析","files":["js/view-word.js","js/prompts.js"],"summary":"Two parallel lines: meaning (translation, word by word, chunks) and grammar (structure, grammar, register, pitfalls, pattern, culture)."},{"id":"file","layer":"feature","label":"File analysis","zh":"文件分析","files":["js/view-dictionary.js","js/view-document.js"],"summary":"Pick a file, name its language, get a summary, a translation, a glossary and a register note. Long files are read in parts you can watch and stop."},{"id":"extract","layer":"module","label":"Text extraction","zh":"文本抽取","files":["js/extract.js","vendor/pdfjs/"],"summary":"Text, Markdown, CSV, subtitles, HTML, PDF (pdf.js, vendored) and DOCX (zip plus DecompressionStream). Keeps line breaks and blank lines; rebuilds PDF lines from y positions."},{"id":"chunking","layer":"feature","label":"Chunked reading","zh":"分块读取","files":["js/extract.js","js/view-word.js"],"summary":"About 20,000 characters per request with overlap, one merge request at the end; up to 200,000 characters, then the file is refused with its size."},{"id":"doc-view","layer":"module","label":"Document page","zh":"文件页","files":["js/view-document.js"],"summary":"Four cards fed by the assembled parts; progress, Stop and Continue in the header; the translation keeps the source shape. The stored entry keeps 60,000 characters of source and says so."},{"id":"starred","layer":"ui","label":"Starred","zh":"星标","files":["js/view-favorites.js"],"summary":"The full set of starred entries, grouped by language, with a practice source selector and wordbooks. A row just unstarred keeps its place with a hollow star until the screen is left."},{"id":"wordbooks","layer":"feature","label":"Wordbooks","zh":"单词本","files":["js/view-favorites.js","js/store.js"],"summary":"Named subsets of the starred set, cross-language, many-to-many; deleting a book only unlinks."},{"id":"starred-groups","layer":"feature","label":"Words / Sentences / Files","zh":"组内三类","files":["js/view-favorites.js"],"summary":"Inside a language: headwords first, then sentences, then documents — the label appears only when more than one kind is present."},{"id":"practice-source","layer":"feature","label":"Practice source","zh":"练习来源","files":["js/view-favorites.js"],"summary":"One control with three tiers: everything starred, one language, or one wordbook. The choice narrows the list and the pool together, so a round only mixes languages when you ask for all of them."},{"id":"practice","layer":"ui","label":"Practice layer","zh":"练习层","files":["js/practice.js"],"summary":"A modal spelling drill: prompt (part of speech and meaning) from the first frame, then typed input judged by language. Nothing is spoken until a hint has been asked for, and typing after a mistake starts a clean attempt."},{"id":"practice-forms","layer":"feature","label":"Spell · Pinyin · Kana","zh":"拼写 / 拼音 / 假名","files":["js/practice.js"],"summary":"Latin languages spell the word; Chinese types the pinyin (tone-aware); Japanese types kana or romaji, and katakana words in katakana."},{"id":"practice-hints","layer":"feature","label":"Hints","zh":"提示","files":["js/practice.js"],"summary":"First hint is IPA for Latin languages, the tone pattern for Chinese and the mora count for Japanese — never the answer. Second hint is the first character."},{"id":"practice-skip","layer":"feature","label":"Skip, fail & loop","zh":"跳过、拼错与回环","files":["js/practice.js","js/view-favorites.js"],"summary":"Skipping a word and failing it on the first try both queue it for the next pass, in the order they happened; the dot row marks skips pale blue and misses pale amber. Close is always available."},{"id":"normalisers","layer":"module","label":"Normalisers","zh":"归一化","files":["js/practice.js"],"summary":"Pinyin with or without tone marks, romaji to kana, hiragana to katakana, long vowels; judging happens on normalised forms."},{"id":"profile","layer":"ui","label":"Profile","zh":"个人","files":["js/view-profile.js"],"summary":"Key, model, per-language explanation defaults, appearance, card preferences, storage, backup, reset, about."},{"id":"card-prefs","layer":"feature","label":"Card preferences","zh":"卡片偏好","files":["js/view-profile.js","js/config.js"],"summary":"Four groups; only the cards a group can produce are listed (25 / 17 / 16 / 9). Each row hides, moves up or down, or goes straight to the top; each group restores on its own."},{"id":"output-table","layer":"feature","label":"Explanation defaults","zh":"解释语言默认值","files":["js/view-profile.js"],"summary":"One row per source language: an English word can be explained in English, a Japanese one in Chinese."},{"id":"ui-language","layer":"feature","label":"Interface language","zh":"界面语言","files":["js/view-profile.js","js/strings.js"],"summary":"Five languages, default Chinese, independent of the explanation language."},{"id":"backup","layer":"feature","label":"Backup & reset","zh":"备份与重置","files":["js/store.js","js/view-profile.js"],"summary":"Export and import JSON (the key is never included), storage report, prune, clear history, stars and cache — each destructive action confirmed."},{"id":"tour","layer":"feature","label":"First-run tour","zh":"新手引导","files":["js/tour.js"],"summary":"Nine spotlight steps across the screens, re-playable from Profile; the card is positioned by a pure function, so a step cannot land off screen."},{"id":"store","layer":"module","label":"Storage","zh":"本地存储","files":["js/store.js"],"summary":"One namespaced key per entry, a history index and wordbooks cached in memory; quota failures prune the oldest unstarred entries and say so if they cannot."},{"id":"ids","layer":"feature","label":"Entry identity","zh":"词条 id","files":["js/store.js"],"summary":"slug, fingerprint, source language, model and explanation language, so the same word in two languages, or in two explanation languages, never collides. A document is fingerprinted over its whole text."},{"id":"import","layer":"feature","label":"Import from 5.x","zh":"导入旧版","files":["js/store.js","js/app.js"],"summary":"dict5 into dict6 (then dict4, dict3): one read, re-keyed, de-duplicated; the old prefix is never written."},{"id":"i18n","layer":"module","label":"strings.js","zh":"文案表","files":["js/strings.js"],"summary":"420 keys in 5 languages, written per language rather than translated word for word; a missing key falls back to English, then to the key itself."},{"id":"api","layer":"module","label":"DeepSeek client","zh":"模型接口","files":["js/api.js"],"summary":"The only place that fetches. JSON mode, no thinking, abortable, 45 s for lookups and 90 s for a document part, retries on 429, 5xx, network and timeout."},{"id":"prompts","layer":"module","label":"Prompt library","zh":"提示词库","files":["js/prompts.js"],"summary":"Seven source languages by seven explanation languages, table-driven; overview, four deep lines, sentence, document and small helper prompts share one set of honesty and length rules."},{"id":"errors","layer":"feature","label":"Error kinds","zh":"错误分类","files":["js/api.js","js/view-dictionary.js"],"summary":"No key, auth, balance, rate limit, timeout, network, offline, bad json, language unclear, aborted — each with its own sentence and next action."},{"id":"build","layer":"module","label":"Build","zh":"打包","files":["tools/build.mjs"],"summary":"Writes dist/site (allowlist) and the single offline file, then asserts both: no external references, the worker inlined, one script block per module."},{"id":"tests","layer":"module","label":"765 assertions","zh":"测试","files":["web/tests/smoke.js"],"summary":"A dependency-free harness that loads the real modules in index.html order into a stubbed browser and drives them."},{"id":"preview","layer":"module","label":"Preview & shots","zh":"预览与截图","files":["tools/preview.mjs"],"summary":"Nineteen panels rendered from the real view code with sample data; each panel can be screenshotted on its own."},{"id":"measure","layer":"module","label":"Measure","zh":"实测","files":["tools/measure.mjs"],"summary":"Real calls with the user's key: time per request, output size, truncation, and the document pipeline part by part."},{"id":"pwa","layer":"module","label":"PWA & offline","zh":"离线与安装","files":["sw.js","js/pwa.js"],"summary":"Shell precache, install prompt, and a single-file build for file:// — the service worker is optional everywhere."},{"id":"packaging","layer":"feature","label":"Desktop & mobile (later)","zh":"桌面与移动端（待做）","files":["README.md","DEPLOY.md"],"summary":"Electron portable exe, Android as a local web page or PWA, Apple via PWA first. The four invariants that keep it cheap are tested."}],"edges":[["shell","router"],["shell","tabs"],["shell","dictionary"],["shell","starred"],["shell","profile"],["shell","i18n"],["shell","tour"],["dictionary","lookup-types"],["dictionary","accent-rescue"],["dictionary","reverse"],["dictionary","surprise"],["dictionary","history"],["dictionary","file"],["entry","overview"],["entry","deep-lines"],["entry","cards"],["entry","forms"],["entry","explain-lang"],["entry","sentence"],["cards","dna"],["file","extract"],["file","chunking"],["file","doc-view"],["starred","starred-groups"],["starred","wordbooks"],["starred","practice-source"],["practice-source","practice"],["practice","practice-forms"],["practice","practice-hints"],["practice","practice-skip"],["practice-forms","normalisers"],["profile","card-prefs"],["profile","output-table"],["profile","ui-language"],["profile","backup"],["profile","tour"],["profile","store"],["overview","api"],["deep-lines","api"],["sentence","api"],["chunking","api"],["api","prompts"],["api","errors"],["store","ids"],["store","import"],["entry","store"],["dictionary","store"],["starred","store"],["practice","store"],["cards","i18n"],["card-prefs","i18n"],["practice","i18n"],["file","i18n"],["build","tests"],["tests","api"],["preview","cards"],["measure","api"],["pwa","shell"],["packaging","pwa"],["packaging","build"]]};
const SVGNS = 'http://www.w3.org/2000/svg';
const COLOUR = { ui: 'var(--ui)', feature: 'var(--feature)', module: 'var(--module)' };
const svg = document.getElementById('graph');
const detail = document.getElementById('detail');
const COL_W = 372, ROW_H = 54, PAD = 22, BOX_W = 258, BOX_H = 38;
const columns = DATA.layers.map((l) => l.id);

document.getElementById('version').textContent = DATA.counts.version;
const STATS = [
  ['语言', DATA.counts.languages + '（在用 ' + DATA.counts.liveLanguages + '）'],
  ['词条卡', DATA.counts.wordCards],
  ['句子卡', DATA.counts.sentenceCards],
  ['文件卡', DATA.counts.documentCards],
  ['界面语言', DATA.counts.uiLanguages],
  ['文案', DATA.counts.strings],
  ['断言', DATA.counts.assertions],
  ['列表 拉丁/日/中/句', [DATA.cardLists.latin, DATA.cardLists.ja, DATA.cardLists.zh, DATA.cardLists.sentence].join(' / ')]
];
STATS.forEach(([label, value]) => {
  const span = document.createElement('span');
  span.className = 'stat';
  span.innerHTML = label + ' <b>' + value + '</b>';
  document.getElementById('stats').append(span);
});

/* What this version added or changed — straight from graph.json's changes[],
   which build.mjs refuses to leave behind. */
if (DATA.latest) {
  const strip = document.getElementById('thisVersion');
  const lead = document.createElement('span');
  lead.textContent = '本版 ' + DATA.latest.version + '：' + (DATA.latest.summary || '');
  strip.append(lead);
  Object.keys(DATA.badges).forEach((id) => {
    const node = DATA.nodes.find((n) => n.id === id);
    if (!node) return;
    const chip = document.createElement('button');
    chip.type = 'button';
    chip.className = 'version-chip ' + DATA.badges[id];
    chip.innerHTML = '<span class="tag">' +
      (DATA.badges[id] === 'new' ? '新增' : '改动') + '</span>' + node.label;
    chip.addEventListener('click', () => select(id));
    strip.append(chip);
  });
}

/* A fixed layered layout: one column per layer, alphabetical inside it. A map,
   not a force simulation — the same data always draws the same picture. */
const nodes = DATA.nodes.slice().sort((a, b) => a.label.localeCompare(b.label));
const layout = {};
columns.forEach((layer, ci) => {
  nodes.filter((n) => n.layer === layer).forEach((n, i) => {
    layout[n.id] = { x: PAD + ci * COL_W, y: PAD + i * ROW_H, w: BOX_W, h: BOX_H, node: n };
  });
});
const height = Math.max.apply(null, Object.keys(layout).map((k) => layout[k].y + layout[k].h)) + PAD;
const width = PAD * 2 + COL_W * columns.length;
svg.setAttribute('viewBox', '0 0 ' + width + ' ' + height);
svg.setAttribute('width', width);
svg.setAttribute('height', height);

const edgeLayer = document.createElementNS(SVGNS, 'g');
const nodeLayer = document.createElementNS(SVGNS, 'g');
svg.append(edgeLayer, nodeLayer);

const edgeEls = DATA.edges.map(([from, to]) => {
  const a = layout[from], b = layout[to];
  if (!a || !b) return null;
  const x1 = a.x + a.w, y1 = a.y + a.h / 2, x2 = b.x, y2 = b.y + b.h / 2;
  const dx = Math.max(50, Math.abs(x2 - x1) * 0.4);
  const p = document.createElementNS(SVGNS, 'path');
  p.setAttribute('class', 'edge');
  p.setAttribute('d', 'M' + x1 + ' ' + y1 + ' C' + (x1 + dx) + ' ' + y1 + ' ' +
    (x2 - dx) + ' ' + y2 + ' ' + x2 + ' ' + y2);
  p.dataset.from = from;
  p.dataset.to = to;
  edgeLayer.append(p);
  return p;
}).filter(Boolean);

const nodeEls = {};
nodes.forEach((n) => {
  const box = layout[n.id];
  const g = document.createElementNS(SVGNS, 'g');
  g.setAttribute('class', 'node');
  g.dataset.id = n.id;
  g.setAttribute('tabindex', '0');
  g.setAttribute('role', 'button');
  const r = document.createElementNS(SVGNS, 'rect');
  r.setAttribute('x', box.x); r.setAttribute('y', box.y);
  r.setAttribute('width', box.w); r.setAttribute('height', box.h);
  r.setAttribute('rx', 9);
  const dot = document.createElementNS(SVGNS, 'circle');
  dot.setAttribute('cx', box.x + 14); dot.setAttribute('cy', box.y + box.h / 2);
  dot.setAttribute('r', 4);
  dot.setAttribute('fill', COLOUR[n.layer]);
  const t = document.createElementNS(SVGNS, 'text');
  t.setAttribute('x', box.x + 26); t.setAttribute('y', box.y + 16);
  t.textContent = n.label;
  const zh = document.createElementNS(SVGNS, 'text');
  zh.setAttribute('class', 'zh');
  zh.setAttribute('x', box.x + 26); zh.setAttribute('y', box.y + 30);
  zh.textContent = n.zh;
  g.append(r, dot, t, zh);
  /* A dot in the corner marks what this version touched. */
  if (DATA.badges[n.id]) {
    const badge = document.createElementNS(SVGNS, 'circle');
    badge.setAttribute('cx', box.x + box.w - 9);
    badge.setAttribute('cy', box.y + 9);
    badge.setAttribute('r', 3.4);
    badge.setAttribute('fill', DATA.badges[n.id] === 'new' ? 'var(--ui)' : 'var(--accent)');
    const title = document.createElementNS(SVGNS, 'title');
    title.textContent = DATA.badges[n.id] === 'new' ? '本版新增' : '本版改动';
    badge.append(title);
    g.append(badge);
  }
  g.addEventListener('click', () => select(n.id));
  g.addEventListener('mouseenter', () => highlight(n.id));
  g.addEventListener('mouseleave', () => highlight(null));
  g.addEventListener('keydown', (event) => {
    if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); select(n.id); }
  });
  nodeLayer.append(g);
  nodeEls[n.id] = g;
});

/* Dim everything that is not the node or its neighbours. Used for hover
   (instant) and for the selection (sticky). */
function highlight(id) {
  const neighbours = {};
  if (id) neighbours[id] = true;
  edgeEls.forEach((e) => {
    const hot = !!id && (e.dataset.from === id || e.dataset.to === id);
    e.classList.toggle('is-hot', hot);
    if (hot) { neighbours[e.dataset.from] = true; neighbours[e.dataset.to] = true; }
  });
  Object.keys(nodeEls).forEach((key) => {
    nodeEls[key].classList.toggle('is-hot', key === id);
    nodeEls[key].classList.toggle('is-dim', !!id && !neighbours[key]);
  });
}

function select(id) {
  const n = DATA.nodes.find((x) => x.id === id);
  highlight(id);

  detail.innerHTML = '';
  const h = document.createElement('h2'); h.textContent = n.label; detail.append(h);
  const zh = document.createElement('div'); zh.className = 'zh'; zh.textContent = n.zh; detail.append(zh);
  const p = document.createElement('p'); p.textContent = n.summary; detail.append(p);
  if (DATA.badges[n.id]) {
    const tag = document.createElement('div'); tag.className = 'label';
    tag.textContent = DATA.badges[n.id] === 'new' ? '新增于 ' + DATA.latest.version : '改于 ' + DATA.latest.version;
    detail.append(tag);
  }
  const list = (label, values) => {
    if (!values || !values.length) return;
    const head = document.createElement('div'); head.className = 'label'; head.textContent = label;
    const ul = document.createElement('ul');
    values.forEach((value) => {
      const li = document.createElement('li');
      const code = document.createElement('code');
      code.textContent = value;
      li.append(code);
      ul.append(li);
    });
    detail.append(head, ul);
  };
  list('Files', n.files);
  list('Keys / routes', n.keys);
}

/* Filters: a layer toggle hides its column; the search dims what does not
   match. Neither changes the layout. */
const hidden = {};
function applyFilters() {
  const q = document.getElementById('q').value.trim().toLowerCase();
  let shown = 0;
  nodes.forEach((n) => {
    const el = nodeEls[n.id];
    const hay = (n.label + ' ' + n.zh + ' ' + n.summary + ' ' + (n.files || []).join(' ')).toLowerCase();
    const visible = !hidden[n.layer] && (!q || hay.indexOf(q) > -1);
    el.style.display = visible ? '' : 'none';
    if (visible) shown += 1;
  });
  edgeEls.forEach((e) => {
    const a = DATA.nodes.find((x) => x.id === e.dataset.from);
    const b = DATA.nodes.find((x) => x.id === e.dataset.to);
    e.style.display = a && b && !hidden[a.layer] && !hidden[b.layer] ? '' : 'none';
  });
  document.getElementById('count').textContent = shown + ' / ' + nodes.length;
}
document.getElementById('q').addEventListener('input', applyFilters);
document.querySelectorAll('[data-layer]').forEach((btn) => {
  btn.addEventListener('click', () => {
    const layer = btn.dataset.layer;
    if (hidden[layer]) delete hidden[layer]; else hidden[layer] = true;
    btn.setAttribute('aria-pressed', String(!hidden[layer]));
    applyFilters();
  });
});
document.getElementById('all').addEventListener('click', () => {
  Object.keys(hidden).forEach((key) => delete hidden[key]);
  document.querySelectorAll('[data-layer]').forEach((b) => b.setAttribute('aria-pressed', 'true'));
  document.getElementById('q').value = '';
  applyFilters();
});
applyFilters();
</script>
</body>
</html>
