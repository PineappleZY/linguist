<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Linguist · 功能大全</title>
<style>
  :root {
    --bg: #f5f5f7; --card: #ffffff; --ink: #1d1d1f; --ink-2: #4b4b52; --ink-3: #86868b;
    --line: #d2d2d7; --accent: #0071e3; --ui: #0a84ff; --feature: #30b0c7; --module: #8e8e93;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #000; --card: #1c1c1e; --ink: #f5f5f7; --ink-2: #c7c7cc; --ink-3: #8e8e93;
      --line: #38383a; --accent: #0a84ff; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans", sans-serif; }
  header { padding: 28px 28px 6px; }
  h1 { margin: 0 0 4px; font-size: 26px; letter-spacing: -0.02em; }
  .sub { color: var(--ink-2); font-size: 14px; max-width: 940px; }
  .stats { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 0; }
  .stat { background: var(--card); border: 0.5px solid var(--line); border-radius: 10px;
    padding: 6px 10px; font-size: 13px; color: var(--ink-2); }
  .stat b { color: var(--ink); font-variant-numeric: tabular-nums; }
  .version-strip { display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
    padding: 10px 28px 0; font-size: 13px; color: var(--ink-2); }
  .version-chip { border: 0.5px solid var(--line); background: var(--card); color: var(--ink);
    border-radius: 999px; padding: 3px 10px; font: inherit; font-size: 12.5px; cursor: pointer; }
  .version-chip .tag { color: var(--ink-3); margin-right: 4px; }
  .version-chip.new .tag { color: var(--ui); }
  .version-chip.updated .tag { color: var(--accent); }
  .bar { display: flex; gap: 8px; align-items: center; padding: 12px 28px; flex-wrap: wrap; }
  input[type=search] { flex: 1 1 260px; max-width: 360px; padding: 8px 12px; border-radius: 10px;
    border: 0.5px solid var(--line); background: var(--card); color: var(--ink); font: inherit; }
  .chip { border: 0.5px solid var(--line); background: var(--card); color: var(--ink-2);
    border-radius: 999px; padding: 5px 12px; font: inherit; font-size: 13px; cursor: pointer; }
  .chip[aria-pressed=false] { opacity: 0.45; }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 390px; gap: 18px; padding: 0 28px 40px; align-items: start; }
  @media (max-width: 1040px) { main { grid-template-columns: 1fr; } aside { position: static; } }
  .canvas { background: var(--card); border: 0.5px solid var(--line); border-radius: 16px;
    overflow: auto; max-height: 78vh; }
  svg { display: block; }
  .edge { stroke: var(--line); stroke-width: 1.1; fill: none; }
  .edge.is-hot { stroke: var(--accent); stroke-width: 2; }
  .node { cursor: pointer; outline: none; }
  .node rect { fill: var(--card); stroke: var(--line); stroke-width: 1; }
  .node text { fill: var(--ink); font-size: 12.5px; pointer-events: none; }
  .node .zh { fill: var(--ink-3); font-size: 11px; }
  .node.is-dim { opacity: 0.2; }
  .node.is-hot rect { stroke: var(--accent); stroke-width: 2; }
  aside { position: sticky; top: 16px; background: var(--card); border: 0.5px solid var(--line);
    border-radius: 16px; padding: 18px 20px; max-height: 78vh; overflow: auto; }
  aside h2 { margin: 0; font-size: 17px; letter-spacing: -0.01em; }
  aside .zh { color: var(--ink-3); font-size: 14px; margin-top: 2px; }
  aside p { color: var(--ink-2); font-size: 14px; }
  aside .label { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3);
    margin: 16px 0 6px; }
  code { background: var(--bg); border: 0.5px solid var(--line); border-radius: 6px;
    padding: 1px 6px; font-size: 12.5px; }
  ul { margin: 0; padding-left: 18px; }
  .hint { color: var(--ink-3); font-size: 13px; }
  .empty { color: var(--ink-3); }
</style>
</head>
<body>
<header>
  <h1>Linguist <span id="version"></span> · 功能大全</h1>
  <div class="sub">每个节点是一件事，连线是「它靠什么完成」。点任意节点看它做什么、在哪几个文件里、涉及哪些键。
  数字由 <code>docs/feature-map/build.mjs</code> 从 <code>7.0/web</code> 直接读出；改了代码，重跑一次即可。</div>
  <div class="stats" id="stats"></div>
  <div class="version-strip" id="thisVersion"></div>
</header>
<div class="bar">
  <input type="search" id="q" placeholder="搜索功能、文件名、说明…" aria-label="搜索">
  <button class="chip" id="all">全部</button>
  <button class="chip" data-layer="ui" aria-pressed="true">界面</button>
  <button class="chip" data-layer="feature" aria-pressed="true">能力</button>
  <button class="chip" data-layer="module" aria-pressed="true">模块</button>
  <span class="hint" id="count"></span>
</div>
<main>
  <div class="canvas"><svg id="graph" xmlns="http://www.w3.org/2000/svg"></svg></div>
  <aside id="detail"><div class="empty">点一个节点看细节。</div></aside>
</main>

hell","layer":"ui","label":"App shell","zh":"应用外壳","files":["js/app.js","index.html"],"summary":"Hash router, top bar, four-tab bar, theme, interface language, first paint. Also the first-run order: import prompt → tour.","keys":["#/dictionary","#/favorites","#/profile","#/word/\u003cid>"]},{"id":"router","layer":"module","label":"Router","zh":"路由","files":["js/app.js"],"summary":"Routes for dictionary, word, roots, root detail, discovery, Starred and Profile; scroll is remembered per route."},{"id":"tabs","layer":"ui","label":"Bottom tabs","zh":"底部四标签","files":["js/app.js"],"summary":"Dictionary / Roots / Starred / Profile — real links, so they can be opened in a new tab."},{"id":"dictionary","layer":"ui","label":"Dictionary","zh":"查词页","files":["js/view-dictionary.js"],"summary":"Search, the four lookup types, the language picker, Surprise, candidates, and history grouped by day.","keys":["lookup-input","lookup-lang","lookup-surprise","history-search"]},{"id":"lookup-types","layer":"feature","label":"Auto · Word · Sentence · File","zh":"四种查询类型","files":["js/view-dictionary.js"],"summary":"Auto guesses between word and sentence at no cost, and falls back to sentence analysis when a word lookup says not_found."},{"id":"accent-rescue","layer":"feature","label":"Accent rescue","zh":"重音模糊输入","files":["js/view-dictionary.js","js/prompts.js"],"summary":"Typing cote in a language with accents asks for the accented candidates first; a form that is itself valid is offered at the top, marked you typed this."},{"id":"reverse","layer":"feature","label":"Reverse lookup","zh":"反查","files":["js/view-dictionary.js"],"summary":"A non-Latin query while a Latin-script language is pinned asks for candidate headwords instead of failing."},{"id":"surprise","layer":"feature","label":"Surprise me","zh":"随手一查","files":["js/view-dictionary.js","js/pool.js"],"summary":"Draws from a persistent 200-word pool, prefers the selected language, and sends non-dictionary languages to a discovery card e entry, and the id carries the language so switching back is a cache hit."},{"id":"sentence","layer":"feature","label":"Sentence analysis","zh":"句子分析","files":["js/view-word.js","js/prompts.js"],"summary":"Two parallel lines: meaning (translation, word by word, chunks) and grammar (structure, grammar, register, pitfalls, pattern, culture)."},{"id":"file","layer":"feature","label":"File analysis","zh":"文件分析","files":["js/view-dictionary.js","js/view-document.js"],"summary":"Pick a file, name its language, get a summary, a translation, a glossary and a register note. Long files are read in parts you can watch and stop."},{"id":"extract","layer":"module","label":"Text extraction","zh":"文本抽取","files":["js/extract.js","vendor/pdfjs/"],"summary":"Text, Markdown, CSV, subtitles, HTML, PDF (pdf.js, vendored) and DOCX (zip plus DecompressionStream). Keeps line breaks and blank lines; rebuilds PDF lines from y positions."},{"id":"chunking","layer":"feature","label":"Chunked reading","zh":"分块读取","files":["js/extract.js","js/view-word.js"],"summary":"About 20,000 characters per request with overlap, one merge request at the end; up to 200,000 characters, then the file is refused with its size."},{"id":"doc-view","layer":"module","label":"Document page","zh":"文件页","files":["js/view-document.js"],"summary":"Four cards fed by the assembled parts; progress, Stop and Continue in the header; the translation keeps the source shape. The stored entry keeps 60,000 characters of source and says so."},{"id":"starred","layer":"ui","label":"Starred","zh":"星标","files":["js/view-favorites.js"],"summary":"Language groups exclude discovery words; a separate Surprise section and reserved book hold them. Rows just unstarred keep their place until the screen is left."},{"id":"wordbooks","layer":"feature","label":"Wordbooks","zh":"单词本","files":["js/view-favorites.js","js/store.js"],"summary":"Normal books are many-to-many and cross-language; the reserved Surprise book only accepts discovery words and cannot be renamed or deleted."},{"id":"starred-groups","layer":"feature","label":"Words / Sentences / Files","zh":"组内三类","files":["js/view-favorites.js"],"summary":"Inside a language: headwords first, then sentences, then documents — the label appears only when more than one kind is present."},{"id":"practice-source","layer":"feature","label":"Practice source","zh":"练习来源","files":["js/view-favorites.js"],"summary":"One control with three tiers: everything starred, one language, or one wordbook. The choice narrows the list and the pool together, so a round only mixes languages when you ask for all of them."},{"id":"practice","layer":"ui","label":"Practice layer","zh":"练习层","files":["js/practice.js","js/roots.js"],"summary":"A modal spelling drill with a language chip, prompt, hints, skip and clean retry; outcomes update root mastery."},{"id":"practice-forms","layer":"feature","label":"Spell · Pinyin · Kana","zh":"拼写 / 拼音 / 假名","files":["js/practice.js"],"summary":"Latin languages spell the word; Chinese types the pinyin (tone-aware); Japanese types kana or romaji, and katakana words in katakana."},{"id":"practice-hints","layer":"feature","label":"Hints","zh":"提示","files":["js/practice.js"],"summary":"First hint is IPA for Latin languages, the tone pattern for Chinese and the mora count for Japanese — never the answer. Second hint is the first character."},{"id":"practice-skip","layer":"feature","label":"Skip, fail & loop","zh":"跳过、拼错与回环","files":["js/practice.js","js/view-favorites.js"],"summary":"Skipping a word and failing it on the first try both queue it for the next pass, in the order they happened; the dot row marks skips pale blue and misses pale amber. Close is always available."},{"id":"normalisers","layer":"module","label":"Normalisers","zh":"归一化","files":["js/practice.js"],"summary":"Pinyin with or without tone marks, romaji to kana, hiragana to katakana, long vowels; judging happens on normalised forms."},{"id":"profile","layer":"ui","label":"Profile","zh":"个人","files":["js/view-profile.js"],"summary":"Key, model, per-language explanation defaults, appearance, card preferences, storage, backup, reset, about."},{"id":"card-prefs","layer":"feature","label":"Card preferences","zh":"卡片偏好","files":["js/view-profile.js","js/config.js"],"summary":"Four groups; only the cards a group can produce are listed (25 / 17 / 16 / 9). Each row hides, moves up or down, or goes straight to the top; each group restores on its own."},{"id":"output-table","layer":"feature","label":"Explanation defaults","zh":"解释语言默认值","files":["js/view-profile.js"],"summary":"One row per source language: an English word can be explained in English, a Japanese one in Chinese."},{"id":"ui-language","layer":"feature","label":"Interface language","zh":"界面语言","files":["js/view-profile.js","js/strings.js"],"summary":"Five languages, default Chinese, independent of the explanation language."},{"id":"backup","layer":"feature","label":"Backup & reset","zh":"备份与重置","files":["js/store.js","js/view-profile.js"],"summary":"Export and import JSON (the key is never included), storage report, prune, clear history, stars and cache — each destructive action confirmed."},{"id":"tour","layer":"feature","label":"First-run tour","zh":"新手引导","files":["js/tour.js"],"summary":"Ten spotlight steps including Roots, re-playable from Profile; positioning is pure and always clamped on screen."},{"id":"store","layer":"module","label":"Storage","zh":"本地存储","files":["js/store.js"],"summary":"dict7 entries, history, wordbooks, root index/progress and the Surprise pool; quota failures prune the oldest unstarred entries."},{"id":"ids","layer":"feature","label":"Entry identity","zh":"词条 id","files":["js/store.js"],"summary":"Word, sentence, document and discovery ids use a readable slug plus a full fingerprint; language, model and explanation language keep variants apart."},{"id":"import","layer":"feature","label":"Import from 6.x","zh":"导入旧版","files":["js/store.js","js/app.js"],"summary":"dict6 into dict7 (then dict5, dict4, dict3): one read, re-keyed, de-duplicated; old prefixes are never written."},{"id":"i18n","layer":"module","label":"strings.js","zh":"文案表","files":["js/strings.js"],"summary":"494 keys in 5 languages, written per language rather than translated word for word; a missing key falls back to English, then to the key itself."},{"id":"api","layer":"module","label":"DeepSeek client","zh":"模型接口","files":["js/api.js"],"summary":"The only place that fetches. JSON mode, no thinking, abortable, 45 s for lookups and 90 s for a document part, retries on 429, 5xx, network and timeout."},{"id":"prompts","layer":"module","label":"Prompt library","zh":"提示词库","files":["js/prompts.js"],"summary":"Full dictionary prompts plus Surprise-pool and discovery-card prompts; seven source languages share honesty and length rules."},{"id":"errors","layer":"feature","label":"Error kinds","zh":"错误分类","files":["js/api.js","js/view-dictionary.js"],"summary":"No key, auth, balance, rate limit, timeout, network, offline, bad json, language unclear, aborted — each with its own sentence and next action."},{"id":"build","layer":"module","label":"Build","zh":"打包","files":["tools/build.mjs"],"summary":"Writes dist/site (allowlist) and the single offline file, then asserts both: no external references, the worker inlined, one script block per module."},{"id":"tests","layer":"module","label":"806 assertions","zh":"测试","files":["web/tests/smoke.js"],"summary":"A dependency-free harness that loads the real modules in index.html order into a stubbed browser and drives them."},{"id":"preview","layer":"module","label":"Preview & shots","zh":"预览与截图","files":["tools/preview.mjs"],"summary":"Nineteen panels rendered from the real view code with sample data; each panel can be screenshotted on its own."},{"id":"measure","layer":"module","label":"Measure","zh":"实测","files":["tools/measure.mjs"],"summary":"Real calls with the user's key: time per request, output size, truncation, and the document pipeline part by part."},{"id":"pwa","layer":"module","label":"PWA & offline","zh":"离线与安装","files":["sw.js","js/pwa.js"],"summary":"Shell precache, install prompt, and a single-file build for file:// — the service worker is optional everywhere."},{"id":"roots-tab","layer":"ui","label":"Roots tab","zh":"词根标签","files":["js/app.js","js/view-roots.js"],"summary":"The fourth bottom tab: due roots, mastery statistics, the root list and a five-question review."},{"id":"root-index","layer":"feature","label":"Root index","zh":"词根索引","files":["js/roots.js","js/store.js"],"summary":"Builds a compact index of roots and components from stored etymology data, with variants and source entries; no model call."},{"id":"root-detail","layer":"feature","label":"Root detail","zh":"词根详情","files":["js/view-roots.js","js/view-word.js"],"summary":"Clickable Word DNA roots open meaning, origin, variants, family words and source entries."},{"id":"root-mastery","layer":"feature","label":"Root mastery","zh":"词根掌握度","files":["js/roots.js","js/practice.js"],"summary":"Strength 0–5 with a 10m/1d/3d/7d/21d/60d ladder; spelling outcomes update the root."},{"id":"root-review","layer":"feature","label":"Root review","zh":"词根复习","files":["js/root-review.js","js/view-roots.js"],"summary":"At most five roots × three fixed stages: meaning choice, spelling and same-root word meaning; progress is root/stage, not a growing question count."},{"id":"surprise-pool","layer":"feature","label":"Surprise pool","zh":"随机词池","files":["js/pool.js","js/api.js","js/prompts.js"],"summary":"200 words in two 100-word batches, persisted used flags, local anti-repeat and a 100-word language top-up."},{"id":"discovery-card","layer":"feature","label":"Discovery card","zh":"异语发现卡","files":["js/view-discovery.js","js/api.js","js/prompts.js"],"summary":"Compact card for a language outside the five: pronunciation, core meaning, two examples and an honest root note."},{"id":"surprise-book","layer":"feature","label":"Surprise wordbook","zh":"随便看看单词本","files":["js/store.js","js/view-favorites.js"],"summary":"The reserved, non-deletable book for discovery words; normal wordbooks reject them and they never enter practice."},{"id":"row-delete","layer":"feature","label":"Delete one row","zh":"单行删除","files":["js/view-dictionary.js","js/view-favorites.js","js/store.js"],"summary":"Sentence, file and discovery rows delete with an eight-second Undo; payload, star and wordbook links are restored."},{"id":"spell-language","layer":"feature","label":"Practice language chip","zh":"拼写语种提示","files":["js/practice.js","js/strings.js"],"summary":"The spelling prompt always names the source language and its code before the part of speech."},{"id":"pool-warmup","layer":"feature","label":"Pool warm-up","zh":"随机池预热","files":["js/pool.js","js/app.js"],"summary":"Starts the 200-word pool in the background when a key exists; keeps at least three unused words in each of the five languages, topping up by 50."},{"id":"language-label","layer":"feature","label":"Language labels","zh":"语言标签","files":["js/ui.js","js/view-discovery.js"],"summary":"Five live languages use the compact EN/FR/DE/JA/ZH badge; other discovery languages use a full localized name."},{"id":"entry-versions","layer":"feature","label":"Explanation versions","zh":"解释语言版本","files":["js/store.js","js/view-word.js"],"summary":"One history group per content and source language; generated explanation-language payloads are switchable versions."},{"id":"root-scope","layer":"feature","label":"Root review scope","zh":"词根复习范围","files":["js/roots.js","js/root-review.js"],"summary":"Due / all / new scopes are applied to the same queue; only starred English/French/German roots with a real root part are eligible."},{"id":"root-sort","layer":"feature","label":"Root sorting","zh":"词根排序","files":["js/view-roots.js","js/roots.js","js/strings.js"],"summary":"Fixed language groups; user switches learning groups, latest, alphabetical or family size, persisted in settings."},{"id":"root-memory","layer":"feature","label":"Root memory curve","zh":"词根记忆曲线","files":["js/roots.js","js/view-roots.js"],"summary":"Ebbinghaus intervals from today to 120 days; only a complete three-stage pass advances the due date; errors never change the date."},{"id":"root-session","layer":"feature","label":"Rolling root session","zh":"词根滚动复习","files":["js/root-review.js"],"summary":"Meaning choice, spelling and same-root word meaning; a wrong stage goes to the end of the queue until answered correctly."},{"id":"root-distractors","layer":"feature","label":"Root distractors","zh":"词根干扰项","files":["js/root-review.js","js/prompts.js"],"summary":"Four distinct, same-language explanation options whose distractors are similar in meaning but clearly different."},{"id":"root-versions","layer":"feature","label":"Root versions","zh":"词根解释版本","files":["js/roots.js","js/store.js"],"summary":"A root keyed by source language keeps separate explanation-language versions; default output language wins and cached versions switch without requests."},{"id":"refresh-events","layer":"feature","label":"Catalog refresh","zh":"即时刷新","files":["js/app.js","js/store.js","js/roots.js"],"summary":"One catalog:changed event invalidates roots and refreshes History, Starred and wordbook views after stars, deletes, Undo and root answers."},{"id":"root-atlas","layer":"feature","label":"Root Atlas","zh":"词根图谱","files":["js/roots.js","js/view-roots.js"],"summary":"Derived public root knowledge layer with search, origin filters, families and confidence; no new model request."},{"id":"root-entity","layer":"feature","label":"RootEntity","zh":"词根实体","files":["js/roots.js"],"summary":"Stable root IDs, variants, meanings, entries, families, confidence and local sources derived from etymology data."},{"id":"personal-root-map","layer":"feature","label":"Personal Root Map","zh":"个人词根地图","files":["js/roots.js","js/view-roots.js"],"summary":"Cards and lightweight relationships for encountered roots, notes, weak roots, mastery and review eligibility."},{"id":"context-to-root","layer":"feature","label":"Context to root","zh":"语境回流","files":["js/view-word.js","js/view-document.js","js/roots.js"],"summary":"Sentence words and document vocabulary link to locally indexed roots; missing roots offer a lookup CTA without silent AI calls."},{"id":"root-search","layer":"feature","label":"Root search","zh":"词根搜索","files":["js/view-roots.js","js/roots.js"],"summary":"Search by root form, variant, family word, meaning and origin family, with language filtering."},{"id":"root-aliases","layer":"feature","label":"Root aliases","zh":"词根别名迁移","files":["js/roots.js","js/store.js"],"summary":"Maps old morpheme keys to stable root IDs while preserving root progress and old backups."},{"id":"root-star","layer":"feature","label":"Root stars","zh":"词根星标","files":["js/roots.js","js/view-roots.js"],"summary":"Explicit root stars join the personal map and review; source-word stars still contribute inherited eligibility."},{"id":"family-relations","layer":"feature","label":"Saved family relations","zh":"词族关系","files":["js/roots.js","js/view-roots.js"],"summary":"Saves root families to the personal map without bulk-starring words or changing wordbook membership."},{"id":"root-migration","layer":"feature","label":"Root progress migration","zh":"词根进度迁移","files":["js/roots.js","js/app.js"],"summary":"Idempotently merges old root keys into canonical rootId while preserving aliases, notes, counters and due dates."},{"id":"packaging","layer":"feature","label":"Desktop & mobile (other assistants)","zh":"桌面与移动端（其他助手）","files":["README.md","DEPLOY.md"],"summary":"Packaging is not part of 7.0 web work; exe, apk and Apple targets are handed to other assistants."}],"edges":[["shell","router"],["shell","tabs"],["shell","dictionary"],["shell","starred"],["shell","profile"],["shell","i18n"],["shell","tour"],["dictionary","lookup-types"],["dictionary","accent-rescue"],["dictionary","reverse"],["dictionary","surprise"],["dictionary","history"],["dictionary","file"],["entry","overview"],["entry","deep-lines"],["entry","cards"],["entry","forms"],["entry","explain-lang"],["entry","sentence"],["cards","dna"],["file","extract"],["file","chunking"],["file","doc-view"],["starred","starred-groups"],["starred","wordbooks"],["starred","practice-source"],["practice-source","practice"],["practice","practice-forms"],["practice","practice-hints"],["practice","practice-skip"],["practice-forms","normalisers"],["profile","card-prefs"],["profile","output-table"],["profile","ui-language"],["profile","backup"],["profile","tour"],["profile","store"],["overview","api"],["deep-lines","api"],["sentence","api"],["chunking","api"],["api","prompts"],["api","errors"],["store","ids"],["store","import"],["entry","store"],["dictionary","store"],["starred","store"],["practice","store"],["cards","i18n"],["card-prefs","i18n"],["practice","i18n"],["file","i18n"],["build","tests"],["tests","api"],["preview","cards"],["measure","api"],["pwa","shell"],["packaging","pwa"],["packaging","build"],["shell","roots-tab"],["roots-tab","root-index"],["roots-tab","root-mastery"],["roots-tab","root-review"],["root-index","dna"],["root-index","store"],["root-detail","root-index"],["root-detail","dna"],["root-mastery","practice"],["root-mastery","root-review"],["root-mastery","store"],["root-review","root-index"],["root-review","i18n"],["profile","roots-tab"],["surprise","surprise-pool"],["surprise-pool","api"],["surprise-pool","prompts"],["surprise-pool","store"],["surprise","discovery-card"],["discovery-card","starred"],["discovery-card","surprise-book"],["discovery-card","api"],["discovery-card","prompts"],["discovery-card","i18n"],["surprise-book","wordbooks"],["surprise-book","starred"],["surprise-book","store"],["row-delete","history"],["row-delete","starred"],["row-delete","store"],["spell-language","practice"],["spell-language","i18n"],["entry","root-detail"],["shell","pool-warmup"],["pool-warmup","surprise-pool"],["pool-warmup","api"],["discovery-card","language-label"],["history","language-label"],["entry","entry-versions"],["row-delete","entry-versions"],["store","entry-versions"],["roots-tab","root-scope"],["root-scope","root-review"],["roots-tab","root-sort"],["roots-tab","root-memory"],["root-memory","root-session"],["root-session","root-review"],["root-review","root-distractors"],["root-index","root-versions"],["entry","root-versions"],["refresh-events","store"],["refresh-events","roots-tab"],["refresh-events","starred"],["refresh-events","history"],["roots-tab","root-atlas"],["root-atlas","root-entity"],["root-atlas","root-search"],["root-atlas","root-aliases"],["root-atlas","personal-root-map"],["personal-root-map","root-review"],["context-to-root","root-atlas"],["context-to-root","sentence"],["context-to-root","doc-view"],["root-aliases","store"],["root-atlas","root-star"],["root-star","personal-root-map"],["root-star","root-review"],["root-migration","root-aliases"],["root-migration","store"],["family-relations","personal-root-map"]]};
const SVGNS = 'http://www.w3.org/2000/svg';
const COLOUR = { ui: 'var(--ui)', feature: 'var(--feature)', module: 'var(--module)' };
const svg = document.getElementById('graph');
const detail = document.getElementById('detail');
const COL_W = 372, ROW_H = 54, PAD = 22, BOX_W = 258, BOX_H = 38;
const columns = DATA.layers.map((l) => l.id);

document.getElementById('version').textContent = DATA.counts.version;
const STATS = [
  ['语言', DATA.counts.languages + '（在用 ' + DATA.counts.liveLanguages + '）'],
  ['词条卡', DATA.counts.wordCards],
  ['句子卡', DATA.counts.sentenceCards],
  ['文件卡', DATA.counts.documentCards],
  ['界面语言', DATA.counts.uiLanguages],
  ['文案', DATA.counts.strings],
  ['断言', DATA.counts.assertions],
  ['列表 拉丁/日/中/句', [DATA.cardLists.latin, DATA.cardLists.ja, DATA.cardLists.zh, DATA.cardLists.sentence].join(' / ')]
];
STATS.forEach(([label, value]) => {
  const span = document.createElement('span');
  span.className = 'stat';
  span.innerHTML = label + ' <b>' + value + '</b>';
  document.getElementById('stats').append(span);
});

/* What this version added or changed — straight from graph.json's changes[],
   which build.mjs refuses to leave behind. */
if (DATA.latest) {
  const strip = document.getElementById('thisVersion');
  const lead = document.createElement('span');
  lead.textContent = '本版 ' + DATA.latest.version + '：' + (DATA.latest.summary || '');
  strip.append(lead);
  Object.keys(DATA.badges).forEach((id) => {
    const node = DATA.nodes.find((n) => n.id === id);
    if (!node) return;
    const chip = document.createElement('button');
    chip.type = 'button';
    chip.className = 'version-chip ' + DATA.badges[id];
    chip.innerHTML = '<span class="tag">' +
      (DATA.badges[id] === 'new' ? '新增' : '改动') + '</span>' + node.label;
    chip.addEventListener('click', () => select(id));
    strip.append(chip);
  });
}

/* A fixed layered layout: one column per layer, alphabetical inside it. A map,
   not a force simulation — the same data always draws the same picture. */
const nodes = DATA.nodes.slice().sort((a, b) => a.label.localeCompare(b.label));
const layout = {};
columns.forEach((layer, ci) => {
  nodes.filter((n) => n.layer === layer).forEach((n, i) => {
    layout[n.id] = { x: PAD + ci * COL_W, y: PAD + i * ROW_H, w: BOX_W, h: BOX_H, node: n };
  });
});
const height = Math.max.apply(null, Object.keys(layout).map((k) => layout[k].y + layout[k].h)) + PAD;
const width = PAD * 2 + COL_W * columns.length;
svg.setAttribute('viewBox', '0 0 ' + width + ' ' + height);
svg.setAttribute('width', width);
svg.setAttribute('height', height);

const edgeLayer = document.createElementNS(SVGNS, 'g');
const nodeLayer = document.createElementNS(SVGNS, 'g');
svg.append(edgeLayer, nodeLayer);

const edgeEls = DATA.edges.map(([from, to]) => {
  const a = layout[from], b = layout[to];
  if (!a || !b) return null;
  const x1 = a.x + a.w, y1 = a.y + a.h / 2, x2 = b.x, y2 = b.y + b.h / 2;
  const dx = Math.max(50, Math.abs(x2 - x1) * 0.4);
  const p = document.createElementNS(SVGNS, 'path');
  p.setAttribute('class', 'edge');
  p.setAttribute('d', 'M' + x1 + ' ' + y1 + ' C' + (x1 + dx) + ' ' + y1 + ' ' +
    (x2 - dx) + ' ' + y2 + ' ' + x2 + ' ' + y2);
  p.dataset.from = from;
  p.dataset.to = to;
  edgeLayer.append(p);
  return p;
}).filter(Boolean);

const nodeEls = {};
nodes.forEach((n) => {
  const box = layout[n.id];
  const g = document.createElementNS(SVGNS, 'g');
  g.setAttribute('class', 'node');
  g.dataset.id = n.id;
  g.setAttribute('tabindex', '0');
  g.setAttribute('role', 'button');
  const r = document.createElementNS(SVGNS, 'rect');
  r.setAttribute('x', box.x); r.setAttribute('y', box.y);
  r.setAttribute('width', box.w); r.setAttribute('height', box.h);
  r.setAttribute('rx', 9);
  const dot = document.createElementNS(SVGNS, 'circle');
  dot.setAttribute('cx', box.x + 14); dot.setAttribute('cy', box.y + box.h / 2);
  dot.setAttribute('r', 4);
  dot.setAttribute('fill', COLOUR[n.layer]);
  const t = document.createElementNS(SVGNS, 'text');
  t.setAttribute('x', box.x + 26); t.setAttribute('y', box.y + 16);
  t.textContent = n.label;
  const zh = document.createElementNS(SVGNS, 'text');
  zh.setAttribute('class', 'zh');
  zh.setAttribute('x', box.x + 26); zh.setAttribute('y', box.y + 30);
  zh.textContent = n.zh;
  g.append(r, dot, t, zh);
  /* A dot in the corner marks what this version touched. */
  if (DATA.badges[n.id]) {
    const badge = document.createElementNS(SVGNS, 'circle');
    badge.setAttribute('cx', box.x + box.w - 9);
    badge.setAttribute('cy', box.y + 9);
    badge.setAttribute('r', 3.4);
    badge.setAttribute('fill', DATA.badges[n.id] === 'new' ? 'var(--ui)' : 'var(--accent)');
    const title = document.createElementNS(SVGNS, 'title');
    title.textContent = DATA.badges[n.id] === 'new' ? '本版新增' : '本版改动';
    badge.append(title);
    g.append(badge);
  }
  g.addEventListener('click', () => select(n.id));
  g.addEventListener('mouseenter', () => highlight(n.id));
  g.addEventListener('mouseleave', () => highlight(null));
  g.addEventListener('keydown', (event) => {
    if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); select(n.id); }
  });
  nodeLayer.append(g);
  nodeEls[n.id] = g;
});

/* Dim everything that is not the node or its neighbours. Used for hover
   (instant) and for the selection (sticky). */
function highlight(id) {
  const neighbours = {};
  if (id) neighbours[id] = true;
  edgeEls.forEach((e) => {
    const hot = !!id && (e.dataset.from === id || e.dataset.to === id);
    e.classList.toggle('is-hot', hot);
    if (hot) { neighbours[e.dataset.from] = true; neighbours[e.dataset.to] = true; }
  });
  Object.keys(nodeEls).forEach((key) => {
    nodeEls[key].classList.toggle('is-hot', key === id);
    nodeEls[key].classList.toggle('is-dim', !!id && !neighbours[key]);
  });
}

function select(id) {
  const n = DATA.nodes.find((x) => x.id === id);
  highlight(id);

  detail.innerHTML = '';
  const h = document.createElement('h2'); h.textContent = n.label; detail.append(h);
  const zh = document.createElement('div'); zh.className = 'zh'; zh.textContent = n.zh; detail.append(zh);
  const p = document.createElement('p'); p.textContent = n.summary; detail.append(p);
  if (DATA.badges[n.id]) {
    const tag = document.createElement('div'); tag.className = 'label';
    tag.textContent = DATA.badges[n.id] === 'new' ? '新增于 ' + DATA.latest.version : '改于 ' + DATA.latest.version;
    detail.append(tag);
  }
  const list = (label, values) => {
    if (!values || !values.length) return;
    const head = document.createElement('div'); head.className = 'label'; head.textContent = label;
    const ul = document.createElement('ul');
    values.forEach((value) => {
      const li = document.createElement('li');
      const code = document.createElement('code');
      code.textContent = value;
      li.append(code);
      ul.append(li);
    });
    detail.append(head, ul);
  };
  list('Files', n.files);
  list('Keys / routes', n.keys);
}

/* Filters: a layer toggle hides its column; the search dims what does not
   match. Neither changes the layout. */
const hidden = {};
function applyFilters() {
  const q = document.getElementById('q').value.trim().toLowerCase();
  let shown = 0;
  nodes.forEach((n) => {
    const el = nodeEls[n.id];
    const hay = (n.label + ' ' + n.zh + ' ' + n.summary + ' ' + (n.files || []).join(' ')).toLowerCase();
    const visible = !hidden[n.layer] && (!q || hay.indexOf(q) > -1);
    el.style.display = visible ? '' : 'none';
    if (visible) shown += 1;
  });
  edgeEls.forEach((e) => {
    const a = DATA.nodes.find((x) => x.id === e.dataset.from);
    const b = DATA.nodes.find((x) => x.id === e.dataset.to);
    e.style.display = a && b && !hidden[a.layer] && !hidden[b.layer] ? '' : 'none';
  });
  document.getElementById('count').textContent = shown + ' / ' + nodes.length;
}
document.getElementById('q').addEventListener('input', applyFilters);
document.querySelectorAll('[data-layer]').forEach((btn) => {
  btn.addEventListener('click', () => {
    const layer = btn.dataset.layer;
    if (hidden[layer]) delete hidden[layer]; else hidden[layer] = true;
    btn.setAttribute('aria-pressed', String(!hidden[layer]));
    applyFilters();
  });
});
document.getElementById('all').addEventListener('click', () => {
  Object.keys(hidden).forEach((key) => delete hidden[key]);
  document.querySelectorAll('[data-layer]').forEach((b) => b.setAttribute('aria-pressed', 'true'));
  document.getElementById('q').value = '';
  applyFilters();
});
applyFilters();
</script>
