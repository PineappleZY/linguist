<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Linguist · 功能大全</title>
<style>
  :root {
    --bg: #f5f5f7; --card: #ffffff; --ink: #1d1d1f; --ink-2: #4b4b52; --ink-3: #86868b;
    --line: #d2d2d7; --accent: #0071e3; --ui: #0a84ff; --feature: #30b0c7; --module: #8e8e93;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #000; --card: #1c1c1e; --ink: #f5f5f7; --ink-2: #c7c7cc; --ink-3: #8e8e93;
      --line: #38383a; --accent: #0a84ff; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans", sans-serif; }
  header { padding: 28px 28px 6px; }
  h1 { margin: 0 0 4px; font-size: 26px; letter-spacing: -0.02em; }
  .sub { color: var(--ink-2); font-size: 14px; max-width: 940px; }
  .stats { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 0; }
  .stat { background: var(--card); border: 0.5px solid var(--line); border-radius: 10px;
    padding: 6px 10px; font-size: 13px; color: var(--ink-2); }
  .stat b { color: var(--ink); font-variant-numeric: tabular-nums; }
  .version-strip { display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
    padding: 10px 28px 0; font-size: 13px; color: var(--ink-2); }
  .version-chip { border: 0.5px solid var(--line); background: var(--card); color: var(--ink);
    border-radius: 999px; padding: 3px 10px; font: inherit; font-size: 12.5px; cursor: pointer; }
  .version-chip .tag { color: var(--ink-3); margin-right: 4px; }
  .version-chip.new .tag { color: var(--ui); }
  .version-chip.updated .tag { color: var(--accent); }
  .bar { display: flex; gap: 8px; align-items: center; padding: 12px 28px; flex-wrap: wrap; }
  input[type=search] { flex: 1 1 260px; max-width: 360px; padding: 8px 12px; border-radius: 10px;
    border: 0.5px solid var(--line); background: var(--card); color: var(--ink); font: inherit; }
  .chip { border: 0.5px solid var(--line); background: var(--card); color: var(--ink-2);
    border-radius: 999px; padding: 5px 12px; font: inherit; font-size: 13px; cursor: pointer; }
  .chip[aria-pressed=false] { opacity: 0.45; }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 390px; gap: 18px; padding: 0 28px 40px; align-items: start; }
  @media (max-width: 1040px) { main { grid-template-columns: 1fr; } aside { position: static; } }
  .canvas { background: var(--card); border: 0.5px solid var(--line); border-radius: 16px;
    overflow: auto; max-height: 78vh; }
  svg { display: block; }
  .edge { stroke: var(--line); stroke-width: 1.1; fill: none; }
  .edge.is-hot { stroke: var(--accent); stroke-width: 2; }
  .node { cursor: pointer; outline: none; }
  .node rect { fill: var(--card); stroke: var(--line); stroke-width: 1; }
  .node text { fill: var(--ink); font-size: 12.5px; pointer-events: none; }
  .node .zh { fill: var(--ink-3); font-size: 11px; }
  .node.is-dim { opacity: 0.2; }
  .node.is-hot rect { stroke: var(--accent); stroke-width: 2; }
  aside { position: sticky; top: 16px; background: var(--card); border: 0.5px solid var(--line);
    border-radius: 16px; padding: 18px 20px; max-height: 78vh; overflow: auto; }
  aside h2 { margin: 0; font-size: 17px; letter-spacing: -0.01em; }
  aside .zh { color: var(--ink-3); font-size: 14px; margin-top: 2px; }
  aside p { color: var(--ink-2); font-size: 14px; }
  aside .label { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3);
    margin: 16px 0 6px; }
  code { background: var(--bg); border: 0.5px solid var(--line); border-radius: 6px;
    padding: 1px 6px; font-size: 12.5px; }
  ul { margin: 0; padding-left: 18px; }
  .hint { color: var(--ink-3); font-size: 13px; }
  .empty { color: var(--ink-3); }
</style>
</head>
<body>
<header>
  <h1>Linguist <span id="version"></span> · 功能大全</h1>
  <div class="sub">每个节点是一件事，连线是「它靠什么完成」。点任意节点看它做什么、在哪几个文件里、涉及哪些键。
  数字由 <code>docs/feature-map/build.mjs</code> 从 <code>7.0/web</code> 直接读出；改了代码，重跑一次即可。</div>
  <div class="stats" id="stats"></div>
  <div class="version-strip" id="thisVersion"></div>
</header>
<div class="bar">
  <input type="search" id="q" placeholder="搜索功能、文件名、说明…" aria-label="搜索">
  <button class="chip" id="all">全部</button>
  <button class="chip" data-layer="ui" aria-pressed="true">界面</button>
  <button class="chip" data-layer="feature" aria-pressed="true">能力</button>
  <button class="chip" data-layer="module" aria-pressed="true">模块</button>
  <span class="hint" id="count"></span>
</div>
<main>
  <div class="canvas"><svg id="graph" xmlns="http://www.w3.org/2000/svg"></svg></div>
  <aside id="detail"><div class="empty">点一个节点看细节。</div></aside>
</main>
<script>
const DATA = __PAYLOAD__;
const SVGNS = 'http://www.w3.org/2000/svg';
const COLOUR = { ui: 'var(--ui)', feature: 'var(--feature)', module: 'var(--module)' };
const svg = document.getElementById('graph');
const detail = document.getElementById('detail');
const COL_W = 372, ROW_H = 54, PAD = 22, BOX_W = 258, BOX_H = 38;
const columns = DATA.layers.map((l) => l.id);

document.getElementById('version').textContent = DATA.counts.version;
const STATS = [
  ['语言', DATA.counts.languages + '（在用 ' + DATA.counts.liveLanguages + '）'],
  ['词条卡', DATA.counts.wordCards],
  ['句子卡', DATA.counts.sentenceCards],
  ['文件卡', DATA.counts.documentCards],
  ['界面语言', DATA.counts.uiLanguages],
  ['文案', DATA.counts.strings],
  ['断言', DATA.counts.assertions],
  ['列表 拉丁/日/中/句', [DATA.cardLists.latin, DATA.cardLists.ja, DATA.cardLists.zh, DATA.cardLists.sentence].join(' / ')]
];
STATS.forEach(([label, value]) => {
  const span = document.createElement('span');
  span.className = 'stat';
  span.innerHTML = label + ' <b>' + value + '</b>';
  document.getElementById('stats').append(span);
});

/* What this version added or changed — straight from graph.json's changes[],
   which build.mjs refuses to leave behind. */
if (DATA.latest) {
  const strip = document.getElementById('thisVersion');
  const lead = document.createElement('span');
  lead.textContent = '本版 ' + DATA.latest.version + '：' + (DATA.latest.summary || '');
  strip.append(lead);
  Object.keys(DATA.badges).forEach((id) => {
    const node = DATA.nodes.find((n) => n.id === id);
    if (!node) return;
    const chip = document.createElement('button');
    chip.type = 'button';
    chip.className = 'version-chip ' + DATA.badges[id];
    chip.innerHTML = '<span class="tag">' +
      (DATA.badges[id] === 'new' ? '新增' : '改动') + '</span>' + node.label;
    chip.addEventListener('click', () => select(id));
    strip.append(chip);
  });
}

/* A fixed layered layout: one column per layer, alphabetical inside it. A map,
   not a force simulation — the same data always draws the same picture. */
const nodes = DATA.nodes.slice().sort((a, b) => a.label.localeCompare(b.label));
const layout = {};
columns.forEach((layer, ci) => {
  nodes.filter((n) => n.layer === layer).forEach((n, i) => {
    layout[n.id] = { x: PAD + ci * COL_W, y: PAD + i * ROW_H, w: BOX_W, h: BOX_H, node: n };
  });
});
const height = Math.max.apply(null, Object.keys(layout).map((k) => layout[k].y + layout[k].h)) + PAD;
const width = PAD * 2 + COL_W * columns.length;
svg.setAttribute('viewBox', '0 0 ' + width + ' ' + height);
svg.setAttribute('width', width);
svg.setAttribute('height', height);

const edgeLayer = document.createElementNS(SVGNS, 'g');
const nodeLayer = document.createElementNS(SVGNS, 'g');
svg.append(edgeLayer, nodeLayer);

const edgeEls = DATA.edges.map(([from, to]) => {
  const a = layout[from], b = layout[to];
  if (!a || !b) return null;
  const x1 = a.x + a.w, y1 = a.y + a.h / 2, x2 = b.x, y2 = b.y + b.h / 2;
  const dx = Math.max(50, Math.abs(x2 - x1) * 0.4);
  const p = document.createElementNS(SVGNS, 'path');
  p.setAttribute('class', 'edge');
  p.setAttribute('d', 'M' + x1 + ' ' + y1 + ' C' + (x1 + dx) + ' ' + y1 + ' ' +
    (x2 - dx) + ' ' + y2 + ' ' + x2 + ' ' + y2);
  p.dataset.from = from;
  p.dataset.to = to;
  edgeLayer.append(p);
  return p;
}).filter(Boolean);

const nodeEls = {};
nodes.forEach((n) => {
  const box = layout[n.id];
  const g = document.createElementNS(SVGNS, 'g');
  g.setAttribute('class', 'node');
  g.dataset.id = n.id;
  g.setAttribute('tabindex', '0');
  g.setAttribute('role', 'button');
  const r = document.createElementNS(SVGNS, 'rect');
  r.setAttribute('x', box.x); r.setAttribute('y', box.y);
  r.setAttribute('width', box.w); r.setAttribute('height', box.h);
  r.setAttribute('rx', 9);
  const dot = document.createElementNS(SVGNS, 'circle');
  dot.setAttribute('cx', box.x + 14); dot.setAttribute('cy', box.y + box.h / 2);
  dot.setAttribute('r', 4);
  dot.setAttribute('fill', COLOUR[n.layer]);
  const t = document.createElementNS(SVGNS, 'text');
  t.setAttribute('x', box.x + 26); t.setAttribute('y', box.y + 16);
  t.textContent = n.label;
  const zh = document.createElementNS(SVGNS, 'text');
  zh.setAttribute('class', 'zh');
  zh.setAttribute('x', box.x + 26); zh.setAttribute('y', box.y + 30);
  zh.textContent = n.zh;
  g.append(r, dot, t, zh);
  /* A dot in the corner marks what this version touched. */
  if (DATA.badges[n.id]) {
    const badge = document.createElementNS(SVGNS, 'circle');
    badge.setAttribute('cx', box.x + box.w - 9);
    badge.setAttribute('cy', box.y + 9);
    badge.setAttribute('r', 3.4);
    badge.setAttribute('fill', DATA.badges[n.id] === 'new' ? 'var(--ui)' : 'var(--accent)');
    const title = document.createElementNS(SVGNS, 'title');
    title.textContent = DATA.badges[n.id] === 'new' ? '本版新增' : '本版改动';
    badge.append(title);
    g.append(badge);
  }
  g.addEventListener('click', () => select(n.id));
  g.addEventListener('mouseenter', () => highlight(n.id));
  g.addEventListener('mouseleave', () => highlight(null));
  g.addEventListener('keydown', (event) => {
    if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); select(n.id); }
  });
  nodeLayer.append(g);
  nodeEls[n.id] = g;
});

/* Dim everything that is not the node or its neighbours. Used for hover
   (instant) and for the selection (sticky). */
function highlight(id) {
  const neighbours = {};
  if (id) neighbours[id] = true;
  edgeEls.forEach((e) => {
    const hot = !!id && (e.dataset.from === id || e.dataset.to === id);
    e.classList.toggle('is-hot', hot);
    if (hot) { neighbours[e.dataset.from] = true; neighbours[e.dataset.to] = true; }
  });
  Object.keys(nodeEls).forEach((key) => {
    nodeEls[key].classList.toggle('is-hot', key === id);
    nodeEls[key].classList.toggle('is-dim', !!id && !neighbours[key]);
  });
}

function select(id) {
  const n = DATA.nodes.find((x) => x.id === id);
  highlight(id);

  detail.innerHTML = '';
  const h = document.createElement('h2'); h.textContent = n.label; detail.append(h);
  const zh = document.createElement('div'); zh.className = 'zh'; zh.textContent = n.zh; detail.append(zh);
  const p = document.createElement('p'); p.textContent = n.summary; detail.append(p);
  if (DATA.badges[n.id]) {
    const tag = document.createElement('div'); tag.className = 'label';
    tag.textContent = DATA.badges[n.id] === 'new' ? '新增于 ' + DATA.latest.version : '改于 ' + DATA.latest.version;
    detail.append(tag);
  }
  const list = (label, values) => {
    if (!values || !values.length) return;
    const head = document.createElement('div'); head.className = 'label'; head.textContent = label;
    const ul = document.createElement('ul');
    values.forEach((value) => {
      const li = document.createElement('li');
      const code = document.createElement('code');
      code.textContent = value;
      li.append(code);
      ul.append(li);
    });
    detail.append(head, ul);
  };
  list('Files', n.files);
  list('Keys / routes', n.keys);
}

/* Filters: a layer toggle hides its column; the search dims what does not
   match. Neither changes the layout. */
const hidden = {};
function applyFilters() {
  const q = document.getElementById('q').value.trim().toLowerCase();
  let shown = 0;
  nodes.forEach((n) => {
    const el = nodeEls[n.id];
    const hay = (n.label + ' ' + n.zh + ' ' + n.summary + ' ' + (n.files || []).join(' ')).toLowerCase();
    const visible = !hidden[n.layer] && (!q || hay.indexOf(q) > -1);
    el.style.display = visible ? '' : 'none';
    if (visible) shown += 1;
  });
  edgeEls.forEach((e) => {
    const a = DATA.nodes.find((x) => x.id === e.dataset.from);
    const b = DATA.nodes.find((x) => x.id === e.dataset.to);
    e.style.display = a && b && !hidden[a.layer] && !hidden[b.layer] ? '' : 'none';
  });
  document.getElementById('count').textContent = shown + ' / ' + nodes.length;
}
document.getElementById('q').addEventListener('input', applyFilters);
document.querySelectorAll('[data-layer]').forEach((btn) => {
  btn.addEventListener('click', () => {
    const layer = btn.dataset.layer;
    if (hidden[layer]) delete hidden[layer]; else hidden[layer] = true;
    btn.setAttribute('aria-pressed', String(!hidden[layer]));
    applyFilters();
  });
});
document.getElementById('all').addEventListener('click', () => {
  Object.keys(hidden).forEach((key) => delete hidden[key]);
  document.querySelectorAll('[data-layer]').forEach((b) => b.setAttribute('aria-pressed', 'true'));
  document.getElementById('q').value = '';
  applyFilters();
});
applyFilters();
</script>
</body>
</html>
